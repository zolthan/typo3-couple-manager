<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <f:flashMessages/>
    <f:if condition="{couples}">
        <div class="couple-list-view card-deck list row">
            <f:for each="{couples}" as="couple">
                <div class="col-lg-4 col-sm-6">
                    <div class="card h-100 {f:if(condition:'{couple.activeCouple} != 1',then:'not-active',else:'active')}">
                        <f:if condition="{couple.image}">
                            <div class="card-img-top ratio-4-3"
                                 style="background-image:url('{f:uri.image(src:'{couple.image.uid}',treatIdAsReference:'1')}'); background-size:cover; background-position:center top;"></div>
                        </f:if>
                        <div class="card-body">
                            <f:if condition="{couple.coupleName}">
                                <h3 class="card-title">
                                    <f:link.action pageUid="{settings.list.detailView}" controller="Couple" action="detail"
                                                   arguments="{couple : couple}" title="Zur Seite von {couple.coupleName}"
                                                   class="stretched-link"><f:format.crop maxCharacters="100">{couple.coupleName}</f:format.crop>
                                    </f:link.action>
                                </h3>
                            </f:if>
                            <p class="card-text">
                                <f:if condition="{couple.startingClassStandard}">
                                    Standard:
                                    <f:if condition="{couple.startingGroup}">
                                        {f:translate(key: couple.startingGroup, extensionName: 'couple_manager')}
                                    </f:if>
                                    <f:format.case mode="upper">{couple.startingClassStandard}</f:format.case>
                                    <br/>
                                </f:if>
                                <f:if condition="{couple.startingClassLatin}">
                                    Latein:
                                    <f:if condition="{couple.startingGroup}">
                                        {f:translate(key: couple.startingGroup, extensionName: 'couple_manager')}
                                    </f:if>
                                    <f:format.case mode="upper">{couple.startingClassLatin}</f:format.case>
                                    <br/>
                                </f:if>
                            </p>
                            <f:if condition="{couple.activeCouple} != 1">
                                <span class="badge badge-secondary">nicht mehr aktiv</span>
                            </f:if>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:if>
</f:section>
</html>
