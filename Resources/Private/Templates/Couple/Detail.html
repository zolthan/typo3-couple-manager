<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <f:flashMessages/>
    <div class="row">
        <div class="{f:if(condition: '{couple.image}', then: 'col-md-6 ')}col-12">
            <f:if condition="{couple.image}">
                <div class="gallery-row row">
                    <div class="gallery-item col-12">
                        <figure class="image">
                            <f:render partial="Image"
                                      arguments="{file: couple.image, settings: settings, class: 'img-fluid'}"/>
                        </figure>
                    </div>
                </div>
            </f:if>
        </div>
        <div class="{f:if(condition: '{couple.image}', then: 'col-md-6 ')}col-12">
            <header>
                <h1 class="element-header text-center">
                    {couple.coupleName}
                </h1>
            </header>
            <f:format.html>{couple.description}</f:format.html>
        </div>
        <div class="col-12">
            <div class="table-responsive">
                <f:groupedFor each="{results}" as="resultsByDiscipline" groupBy="discipline" groupKey="discipline">
                    <table class="table table-sm table-striped">
                        <caption>Turnierergebnisse
                            <f:translate
                                    key="LLL:EXT:couple_manager/Resources/Private/Language/locallang.xlf:{discipline}"/>
                        </caption>
                        <f:render partial="Result/TableHeader" arguments="{omit:{couple:1}}"/>
                        <tbody>
                        <f:for each="{resultsByDiscipline}" as="result" key="itemkey"
                               reverse="false" iteration="iterator">
                            <f:render partial="Result/TableRow" arguments="{result:result, omit:{couple:1}}"/>
                        </f:for>
                        </tbody>
                    </table>
                </f:groupedFor>
            </div>
        </div>
    </div>
</f:section>
</html>
